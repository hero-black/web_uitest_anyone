# ============================================
# 页面元素别名注册表
# ============================================
# 使用方法：
# 1. 在 Chrome 中按 F12 打开开发者工具
# 2. 用元素选择器（左上角箭头）点击页面元素
# 3. 在 Elements 面板中找到该元素的选择器
# 4. 在下方对应页面中添加/修改别名和选择器
#
# 别名 = 测试用例 YAML 中使用的名称
# 例如：用例中写 "点击: 登录按钮"，这里就要有 "登录按钮" 的别名
#
# 定位方式: css / text / placeholder / id / xpath / role / label
# ============================================

登录页:
  用户名输入框:
    定位方式: placeholder
    选择器: "用户名"
  密码输入框:
    定位方式: id
    选择器: "passwordRef"
  登录按钮:
    定位方式: css
    选择器: "button.loginBtn"

