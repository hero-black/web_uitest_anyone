用例名称: 新建数据源
描述: 登录后新建一个数据源，验证创建成功，最后删除清理
需要登录: true
说明: 此用例为模板，请根据实际页面补充步骤中的元素别名和操作

步骤:
  - 点击: 智慧病房
  - 点击: 数据中心
  - 点击: 数据对接2.0
  - 点击: 数据源管理
  - 点击: 新增数据源按钮
  - 输入: {元素: 平台厂家输入框, 内容: "测试平台厂家"}
  - 点击: 接口
  - 下拉选择: {元素: 协议类型, 选项: http}
  - 输入: {元素: url, 内容: "http://192.168.3.237:9999/inpatient"}
  - 下拉选择: {元素: 请求方式, 选项: POST}
  - 下拉选择: {元素: 内容类型, 选项: application/json}
  - 点击: 测试连接按钮
  - 看到文字: 连接成功
  - 点击: 保存按钮
  - 等待: 2

预期:
  - 看到文字: 保存成功

# 清理:
#   - 点击: 删除数据源按钮
#   - 点击: 确认删除按钮
